name: Daily Contribution Generator

on: 
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity Log
        run: |
          echo "Last automated update: $(date)" >> activity.log

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'hassan-moha'
          git config --global user.email 'kingsantoz19@gmail.com' # Must match your account email!
          git add activity.log
          git commit -m "chore: daily activity log update [skip ci]"
          git push
